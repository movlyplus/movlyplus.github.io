
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movly+</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:40px">
<h2>Movly+</h2>
<p id="msg">كنفتحو ليك الفيلم...</p>
<script>
var id = new URLSearchParams(location.search).get("id");

setTimeout(function(){
  document.getElementById("msg").innerText =
    "إلا ما تفتحش التطبيق، تأكد أنه مثبت عندك.";
}, 2500);

location.href = "intent://movlyplus.github.io/movies/?id=" +
  encodeURIComponent(id || "") +
  "#Intent;scheme=https;package=com.movlyplus;end";
</script>
</body>
</html>
